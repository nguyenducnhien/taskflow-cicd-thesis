server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # React Router uses client-side routing (BrowserRouter), so a direct
  # request or refresh on e.g. /projects/5 has no matching file on disk —
  # fall back to index.html and let React Router render the right page.
  location / {
    try_files $uri /index.html;
  }
}
